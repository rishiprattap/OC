<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Status | Offstage Creators</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script src="/js/analytics.js"></script>
  <style>
    .redirect-card {
      max-width: 480px; margin: 80px auto; padding: 40px;
      background: #141210; border: 1px solid #2a231c; border-radius: 14px;
      text-align: center;
    }
    .redirect-card h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 36px; color: #f7eee1; margin: 12px 0; }
    .redirect-card p { color: #8e8477; font-size: 14px; }
  </style>
</head>
<body>
  <div class="grain-layer"></div>
  <main style="padding: 20px;">
    <div class="redirect-card">
      <div style="font-size: 40px; margin-bottom: 16px;">🎙️</div>
      <h1>Redirecting…</h1>
      <p id="redirectMsg">Taking you to your registration pass.</p>
    </div>
  </main>
  <script>
    // Redirect to /registration/:id if ID is in query string (legacy support)
    (function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || params.get('registration_id');
      if (id) {
        window.location.replace('/registration/' + encodeURIComponent(id.trim().toUpperCase()));
      } else {
        document.getElementById('redirectMsg').textContent = 'No registration ID found. Redirecting to home…';
        setTimeout(() => { window.location.replace('/'); }, 2000);
      }
    })();
  </script>
</body>
</html>
